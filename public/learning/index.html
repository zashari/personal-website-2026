<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#550000" />
<title>ML Reboot, epoch 0/16</title>
<meta name="description" content="A 16-week machine learning comeback, tracked like a training run: one learning curve, daily lessons, checkpoints and logged hours, synced to the cloud." />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2"/><link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2"/><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Shantell+Sans:wght@400;600&display=swap" />
<style>
/* Layout: an engineering computation pad. Each view is a sheet with a pad header block; wide screens get a margin column, phones get a bottom tab bar. The learning curve is the only loud element. */
:root {
  /* Paper: every sheet, card and input is the same cream stock. */
  --pad: #e3dac9;
  --sheet: #e3dac9;
  --grid: #cdc1a9;
  --rule: #a8987b;
  --ink-paper: #23271f;
  --ink-soft-paper: #4b5645;
  --ink: var(--ink-paper);
  --ink-soft: var(--ink-soft-paper);
  /* The desk the sheets lie on: deep maroon with a white grid. */
  --desk: #550000;
  --desk-grid: rgba(255, 255, 255, 0.32);
  --on-desk: #ffffff;
  --on-desk-soft: #f3d9d9;
  --pen: #2340a0;
  --pen-ink: #f5f0e6;
  --marker: #ff4f8b;
  --marker-wash: #ffc6d9;
  --plan: #4a5e44;
  --ok: #176130;
  --bad: #b3264f;
  --font-ui: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Shantell Sans", "Segoe Print", "Comic Neue", cursive;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--desk);
  background-image: linear-gradient(var(--desk-grid) 1px, transparent 1px), linear-gradient(90deg, var(--desk-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
  color: var(--ink);
  font: 400 16px/1.55 var(--font-ui);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; max-width: 70ch; }
.soft { color: var(--ink-soft); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.hand { font-family: var(--font-hand); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 10; background: var(--sheet); border-bottom: 2px solid var(--ink); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 1200px; margin: 0 auto; padding-inline: 16px; min-height: 60px; display: flex; align-items: center; gap: 24px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; border: 0; background: none; padding: 0; }
.brand span { font-family: var(--font-hand); font-weight: 600; color: var(--marker); margin-left: 6px; font-size: 15px; letter-spacing: 0; }
.tabs { display: flex; gap: 2px; flex: 1; }
.tab { border: 0; background: none; min-height: 44px; padding-inline: 14px; font-weight: 600; color: var(--ink-soft); border-bottom: 3px solid transparent; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--marker); }
.sync { font-size: 14px; color: var(--ink-soft); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); display: inline-block; }
.sync[data-s="saved"] i { background: var(--ok); }
.sync[data-s="saving"] i { background: var(--pen); }
.sync[data-s="paused"] i, .sync[data-s="error"] i { background: var(--marker); }

.bottom { display: none; }
@media (max-width: 760px) {
  .tabs { display: none; }
  .top-in { justify-content: space-between; min-height: 52px; }
  .bottom { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--sheet); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottom button { border: 0; background: none; min-height: 60px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .bottom svg { width: 22px; height: 22px; }
  .bottom button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--marker); }
  main { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }
}

main { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
main > * { min-width: 0; }
/* Anything placed straight on the desk reads in white; paper surfaces switch back to pencil ink. */
main { --ink: var(--on-desk); --ink-soft: var(--on-desk-soft); color: var(--ink); }
main :focus-visible { outline-color: var(--on-desk); }
main .crumbs button { color: var(--on-desk); }
.sheet, .padhead, .index, .flash, .subtabs, .input { --ink: var(--ink-paper); --ink-soft: var(--ink-soft-paper); color: var(--ink); }
.sheet :focus-visible, .padhead :focus-visible, .index :focus-visible, .flash:focus-visible, .subtabs :focus-visible, .input:focus-visible { outline-color: var(--pen); }

/* Pad header block, the boxes printed on a computation pad */
.padhead { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); border: 2px solid var(--ink); background: var(--sheet); }
.padhead > div { padding: 10px 14px; border-right: 1px solid var(--ink); min-width: 0; }
.padhead > div:last-child { border-right: 0; }
.padhead small { display: block; font-size: 12px; color: var(--ink-soft); }
.padhead b { font-size: 16px; overflow-wrap: anywhere; }
.padhead .stepper { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.iconbtn { border: 1.5px solid var(--ink); background: var(--sheet); width: 36px; height: 36px; display: inline-grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
@media (max-width: 600px) {
  .padhead { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .padhead > div:first-child { grid-column: 1 / -1; border-right: 0; border-bottom: 1px solid var(--ink); }
}

/* Sheets */
.sheet { background: var(--sheet); border: 2px solid var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.sheet.single { grid-template-columns: minmax(0, 1fr); }
.sheet > .main { padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; min-width: 0; }
.sheet > .margin { padding: 22px 20px; border-left: 2px solid var(--marker); display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; min-width: 0; }
.sheet > .main > *, .sheet > .margin > * { min-width: 0; }
@media (max-width: 960px) {
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet > .margin { border-left: 0; border-top: 2px solid var(--marker); }
}
.block { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.block > * { min-width: 0; }
.rowhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pagehead { display: flex; justify-content: space-between; align-items: end; gap: 12px 20px; flex-wrap: wrap; }
.pagehead p { margin-top: 6px; }

/* Chart */
.chartbox { overflow-x: auto; min-width: 0; max-width: 100%; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-soft); }
.legend li { display: flex; align-items: center; gap: 8px; }
.score { display: flex; align-items: center; gap: 10px; }
.score b { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.score span { font-size: 14px; line-height: 1.3; color: var(--ink-soft); }
.score em { font-style: normal; font-weight: 700; color: var(--ink); }
.score em[data-tone="behind"] { color: var(--bad); }
.score em[data-tone="ahead"] { color: var(--ok); }
.chartbox svg { display: block; width: 100%; min-width: 540px; height: auto; }
@media (prefers-reduced-motion: no-preference) {
  .drawn { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease-out 0.15s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

/* Checklists */
.checks { display: grid; grid-template-columns: minmax(0, 1fr); }
.check { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; min-height: 44px; padding-block: 9px; border-bottom: 1px dashed var(--rule); cursor: pointer; position: relative; }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { width: 24px; height: 24px; border: 2px solid var(--ink); display: grid; place-items: center; background: var(--sheet); margin-top: 1px; }
.box svg { width: 18px; height: 18px; visibility: hidden; }
.check input:checked + .box svg { visibility: visible; }
.check input:focus-visible + .box { outline: 3px solid var(--pen); outline-offset: 2px; }
.check input:checked ~ .txt { color: var(--ink-soft); }
.txt small { display: block; color: var(--ink-soft); font-size: 14px; }
.tickpath { stroke-dasharray: 22; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .check input:checked + .box .tickpath { animation: tick 0.22s ease-out; }
  @keyframes tick { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
}

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding-inline: 18px; border: 2px solid var(--pen); background: var(--pen); color: var(--pen-ink); font-weight: 700; font-size: 15px; text-decoration: none; text-align: center; }
.btn.line { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 40px; padding-inline: 12px; font-size: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 14px; font-weight: 600; }
.input { min-height: 44px; border: 2px solid var(--ink); background: var(--sheet); padding-inline: 10px; width: 100%; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }

/* Week strip */
.days { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.day { border: 1.5px solid var(--ink); background: var(--sheet); min-height: 58px; display: grid; align-content: center; justify-items: center; font-size: 13px; line-height: 1.25; padding: 4px 2px; }
.day.done { background: var(--ink); color: var(--sheet); }
.day.today { outline: 3px solid var(--marker); outline-offset: 1px; }

/* Meter */
.meter { height: 12px; border: 1.5px solid var(--ink); position: relative; background: var(--sheet); }
.meter span { position: absolute; inset: 0 auto 0 0; background: var(--pen); }
.meter em { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }

/* Notes on ruled lines */
.note { width: 100%; min-height: 140px; resize: vertical; border: 0; border-top: 1px dashed var(--rule); background: repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px); line-height: 28px; padding: 0 2px; font-family: var(--font-hand); font-size: 16px; }
.note::placeholder { color: var(--ink-soft); }

/* Boxed notes for required output and exit criteria */
.boxnote { border: 2px dashed var(--ink); padding: 12px 14px; display: grid; gap: 4px; }
.today { display: grid; gap: 14px; padding: 20px; border: 2px solid var(--ink); background: var(--pad); }
.kicker { font-weight: 700; font-size: 15px; }
.big-title { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; }
.btn.big { min-height: 52px; padding-inline: 24px; font-size: 17px; }
.deliver { font-weight: 700; font-size: 17px; max-width: 60ch; }
.deeper { border-top: 2px solid var(--ink); padding-top: 18px; gap: 22px; }
.help { border-top: 2px solid var(--ink); padding-top: 14px; }
.help summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.help dl { margin: 6px 0 0; display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 10px 18px; }
.help dt { font-weight: 700; }
.help dd { margin: 0; color: var(--ink-soft); }
@media (max-width: 600px) { .help dl { grid-template-columns: minmax(0, 1fr); } .help dd { margin-bottom: 6px; } }
.boxnote b { font-size: 14px; }
.boxnote.exit { border-color: var(--marker); }
.boxnote p { font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--ink); padding: 3px 10px; font-size: 14px; background: var(--sheet); color: var(--ink); text-decoration: none; }
a.chip:hover { border-color: var(--pen); color: var(--pen); }

/* Roadmap */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 600px) { .filters { grid-template-columns: minmax(0, 1fr); } }
.phase { display: grid; grid-template-columns: minmax(0, 1fr); }
.phase-head { display: grid; gap: 4px; padding-block: 22px 10px; border-bottom: 2px solid var(--ink); }
.phase-head .rowhead { align-items: baseline; }
.wk, .cp { border-bottom: 1px solid var(--rule); }
.wk > summary, .cp > summary { list-style: none; display: grid; grid-template-columns: 82px minmax(0, 1fr) 130px; gap: 14px; align-items: center; min-height: 56px; padding: 8px 4px; cursor: pointer; }
.wk > summary::-webkit-details-marker, .cp > summary::-webkit-details-marker { display: none; }
.wk.current > summary { background: linear-gradient(90deg, var(--marker-wash), transparent 75%); }
.sheetno { font-weight: 700; font-size: 14px; }
.bar { height: 8px; border: 1.5px solid var(--ink); position: relative; display: block; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.pct { display: grid; gap: 4px; }
.wk .body, .cp .body { padding: 6px 4px 22px 100px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.stamp { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--sheet); }
.stamp.done { background: var(--marker-wash); }
.dayrow { display: grid; grid-template-columns: 28px 44px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px dashed var(--rule); position: relative; }
.dayrow:last-child { border-bottom: 0; }
.dayrow .check { border: 0; padding: 0; min-height: 0; grid-template-columns: 28px; }
.linkbtn { border: 0; background: none; padding: 6px 0; text-align: left; color: var(--pen); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 640px) {
  .wk > summary, .cp > summary { grid-template-columns: 64px minmax(0, 1fr); }
  .wk > summary .pct, .cp > summary .pct { grid-column: 2; }
  .wk .body, .cp .body { padding-left: 4px; }
}

/* Lesson */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.crumbs button { border: 0; background: none; padding: 4px 0; color: var(--pen); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.searchrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
@media (max-width: 600px) { .searchrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .searchrow .input { grid-column: 1 / -1; } }
.links { display: grid; grid-template-columns: minmax(0, 1fr); }
.links a { display: block; padding-block: 10px; border-bottom: 1px dashed var(--rule); text-decoration: none; color: var(--ink); min-height: 44px; }
.links a:last-child { border-bottom: 0; }
.links a b { color: var(--pen); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.links a span { display: block; font-size: 14px; color: var(--ink-soft); overflow-wrap: anywhere; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 700px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.numbered { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: n; }
.numbered li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; counter-increment: n; }
.numbered li::before { content: counter(n); width: 26px; height: 26px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.sessions { display: grid; grid-template-columns: minmax(0, 1fr); }
.sessions button { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 8px; align-items: center; text-align: left; border: 0; border-bottom: 1px dashed var(--rule); background: none; padding: 10px 2px; min-height: 48px; }
.sessions button[aria-current="true"] { background: var(--marker-wash); }
.sessions svg { width: 18px; height: 18px; }

/* Practice */
.subtabs { display: flex; gap: 0; border: 2px solid var(--ink); width: fit-content; max-width: 100%; }
.subtabs button { border: 0; background: var(--sheet); min-height: 44px; padding-inline: 16px; font-weight: 700; }
.subtabs button + button { border-left: 2px solid var(--ink); }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; }
.index { background: var(--sheet); border: 2px solid var(--ink); background-image: linear-gradient(var(--marker) 2px, transparent 2px), repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); background-position: 0 52px, 0 52px; background-repeat: no-repeat, repeat; padding: 14px 18px 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.index .q { font-weight: 700; min-height: 36px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 44px; padding-block: 6px; cursor: pointer; }
.opt input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--pen); }
.opt.right span { font-weight: 700; color: var(--ok); }
.opt.wrong span { text-decoration: line-through; color: var(--bad); }
.verdict { font-family: var(--font-hand); font-size: 16px; }
.flash { min-height: 230px; border: 2px solid var(--ink); background: var(--sheet); display: grid; place-items: center; text-align: center; padding: 24px; width: 100%; gap: 10px; }
.flash .term { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.flash .def { font-size: 18px; max-width: 46ch; }

/* Hours */
.entries { display: grid; grid-template-columns: minmax(0, 1fr); }
.entry { display: grid; grid-template-columns: 72px minmax(0, 1fr) 56px 44px; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px dashed var(--rule); font-size: 15px; }
.entry b { text-align: right; }
.empty { font-family: var(--font-hand); font-size: 16px; color: var(--ink-soft); padding-block: 8px; }

/* More */
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 8px 28px; }
.setting { display: grid; gap: 8px; padding-block: 16px; border-bottom: 1px dashed var(--rule); }
.setting:last-child { border-bottom: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--sheet); padding: 12px 18px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 760px) { .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media print {
  :root { --pad: #ffffff; --sheet: #ffffff; --grid: #ffffff; --rule: #b8b8b8; --ink: #111111; --ink-soft: #444444; --marker: #111111; --marker-wash: #eeeeee; color-scheme: light; }
  body { background-image: none; }
  .top, .bottom, .toast, .btn, .iconbtn, .linkbtn, .btnrow, .subtabs { display: none !important; }
  details { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-page="today" aria-label="ML Reboot, go to Today">ML Reboot<span>run 01</span></button>
    <nav class="tabs" aria-label="Main" id="tabs"></nav>
    <div class="sync" id="sync" data-s="idle" role="status"><i aria-hidden="true"></i><span>Checking sync</span></div>
  </div>
</header>
<main id="content"></main>
<nav class="bottom" aria-label="Main" id="bottomnav"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input class="sr-only" id="importFile" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true" />
<script>
'use strict';

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayLocal=()=>isoDate(new Date());
const parseISO=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d)};
const shortDate=s=>{const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()]}`};
const dayDate=s=>{const d=parseISO(s);return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`};

/* Where today falls in the 16-week run. */
function calendar(){
  const diff=Math.round((parseISO(todayLocal())-parseISO(DATA.start))/864e5);
  if(diff<0)return{status:'before',week:1,day:0,elapsed:0,sunday:false,daysToStart:-diff};
  if(diff>=112)return{status:'after',week:16,day:5,elapsed:16,sunday:false};
  const dow=diff%7;
  return{status:'during',week:Math.floor(diff/7)+1,day:Math.min(dow,5),sunday:dow===6,elapsed:(diff+1)/7};
}
const CAL=calendar();

/* Cloud sync: unchanged protocol with the Worker (GET/PUT /learning/api/progress, 401 pauses, 409 adopts the newer copy). */
function setSync(s,label){const el=$('sync');if(!el)return;el.dataset.s=s;el.querySelector('span').textContent=label}
const CLOUD_META=STORE+':cloud-meta';let cloudUpdatedAt=0;try{cloudUpdatedAt=Number(JSON.parse(localStorage.getItem(CLOUD_META)||'{}').updatedAt)||0}catch(e){}
let cloudTimer=null,cloudInFlight=false,cloudDirty=false,cloudPaused=false,cloudConflictNotified=false;
function persistCloudMeta(){try{localStorage.setItem(CLOUD_META,JSON.stringify({updatedAt:cloudUpdatedAt}))}catch(e){}}
function setCloudUpdatedAt(ts){cloudUpdatedAt=Number(ts)||Date.now();persistCloudMeta()}
function stateHasProgress(s){return !!(Object.values(s.tasks||{}).some(Boolean)||Object.values(s.days||{}).some(Boolean)||Object.values(s.milestones||{}).some(Boolean)||(s.logs||[]).length||Object.keys(s.notes||{}).length||Object.keys(s.answers||{}).length||Object.keys(s.flash||{}).length||Object.keys(s.lessonTopics||{}).length||Object.keys(s.dayNotes||{}).length||Object.values(s.exercises||{}).some(Boolean))}
function scheduleCloudSync(){if(cloudPaused)return;cloudUpdatedAt=Date.now();persistCloudMeta();cloudDirty=true;setSync('saving','Saving');clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloudProgress,1500)}
async function pushCloudProgress(){if(cloudPaused||cloudInFlight||!cloudDirty)return;cloudInFlight=true;const payload={version:1,updatedAt:cloudUpdatedAt,state};try{const r=await fetch('/learning/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true});if(r.status===401){cloudPaused=true;setSync('paused','Sign in again to sync');notify('Cloud sync paused. Reload and sign in again to resume syncing.');return}if(r.status===409){const data=await r.json().catch(()=>null);if(data&&data.state){state={...newState(),...data.state};setCloudUpdatedAt(data.updatedAt||Date.now());try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}cloudDirty=false;setSync('saved','Saved to cloud');render();if(!cloudConflictNotified){cloudConflictNotified=true;notify('Progress updated from another session, so this page refreshed to the latest copy.')}}return}if(!r.ok)throw new Error('Cloud sync failed with status '+r.status);cloudDirty=false;setSync('saved','Saved to cloud')}catch(e){console.error('Cloud sync failed',e);setSync('error','Saved on this device only')}finally{cloudInFlight=false}}
async function syncCloudOnLoad(){try{const r=await fetch('/learning/api/progress',{headers:{Accept:'application/json'}});if(r.status===401){cloudPaused=true;setSync('paused','Sign in again to sync');return}if(!r.ok){setSync('error','Saved on this device only');return}const data=await r.json();if(data.exists&&data.state){if((data.updatedAt||0)>cloudUpdatedAt||!stateHasProgress(state)){state={...newState(),...data.state};setCloudUpdatedAt(data.updatedAt||Date.now());try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}render();notify('Progress synced from cloud.')}else if(stateHasProgress(state)){cloudDirty=true;await pushCloudProgress()}}else if(stateHasProgress(state)){if(!cloudUpdatedAt)setCloudUpdatedAt(Date.now());cloudDirty=true;await pushCloudProgress();notify('Existing progress backed up to cloud.')}if(!cloudDirty&&!cloudPaused)setSync('saved','Saved to cloud')}catch(e){console.error('Cloud sync on load failed',e);setSync('error','Saved on this device only')}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloudDirty)pushCloudProgress()});window.addEventListener('pagehide',()=>{if(cloudDirty)pushCloudProgress()});

/* Progress maths */
const boolCount=obj=>Object.values(obj||{}).filter(Boolean).length;
function weekChecks(n){const w=week(n);const tasks=w.tasks.filter((t,i)=>state.tasks[wkey(n,i)]).length;const days=w.days.filter((t,i)=>state.days[wkey(n,i)]).length;return{tasks,days,percent:Math.round((tasks+days)/12*100)}}
const weekFraction=n=>{const c=weekChecks(n);return(c.tasks+c.days)/12};
/* Share of the whole curriculum learned (sessions + tasks), counting weeks 1..n. Rises from 0 to 1. */
function learnedThrough(n){let s=0;for(let i=1;i<=n;i++)s+=weekFraction(i);return s/16}
const learnedAll=()=>learnedThrough(16);

const totalHours=()=>state.logs.reduce((a,l)=>a+(Number(l.hours)||0),0);

const milestoneDone=m=>m.criteria.filter((_,i)=>state.milestones[wkey(m.week,i)]).length;

    <li><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--marker)" stroke="var(--ink)" stroke-width="1.5"/></svg>Today</li>
    <li><svg width="22" height="22"><circle cx="11" cy="11" r="9" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/><text x="11" y="14.5" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)" font-family="Schibsted Grotesk, system-ui, sans-serif">C1</text></svg>Checkpoint</li>

function chart(){
  const L=64,R=700,T=30,B=250,X=w=>L+w*(R-L)/16,Y=p=>B-p*(B-T);
  const el=Math.min(16,Math.max(0,CAL.elapsed)),now=learnedAll();
  const pts=[[0,0]];for(let n=1;n<=Math.floor(el)&&n<16;n++)pts.push([n,learnedThrough(n)]);
  pts.push([el,now]);
  const poly=pts.map(([w,p])=>`${X(w).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(X(pts[i][0])-X(pts[i-1][0]),Y(pts[i][1])-Y(pts[i-1][1]));
  const cx=X(el),cy=Y(now);
  // Note sits up-right of the dot, or down-left when the dot is near the top or right edge.
  const right=cx<470,up=cy>110,tx=right?cx+64:cx-64,ty=up?cy-58:cy+46,anchor=right?'start':'end',sx=right?1:-1,vy=up?1:-1;
  const ax=cx+9*sx,ay=cy-10*vy,sy=up?ty+26:ty-18;
  const curveTo=`M ${tx-6*sx} ${sy} C ${tx-24*sx} ${sy+6*vy}, ${cx+24*sx} ${cy-28*vy}, ${ax} ${ay}`;
  const head=`M ${ax} ${ay} l ${1*sx} ${-11*vy} M ${ax} ${ay} l ${10*sx} ${-4*vy}`;
  const curW=CAL.status==='during'?CAL.week:null;
  const cps=DATA.milestones.map((m,i)=>`<circle cx="${X(m.week)}" cy="296" r="11" fill="${completedMilestone(m)?'var(--marker-wash)':'var(--sheet)'}" stroke="var(--ink)" stroke-width="1.5"/><text x="${X(m.week)}" y="300" fill="var(--ink)">C${i+1}</text>`).join('');
  const empty=now===0;
  const emptyMsg=CAL.status==='before'?['Your line starts here on '+dayDate(DATA.start)+'.','Finish a session or task to draw it.']:['No sessions or tasks finished yet.','Tick one off and your line starts rising.'];
  const label=`Curriculum learned so far: ${pct(now)}. The plan rises from 0 percent at week 0 to 100 percent at week 16. You are ${pace()}.`;
  return `${chartLegend()}<div class="chartbox" role="img" aria-label="${esc(label)}" data-focus="${(cx/720).toFixed(3)}"><svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
    <rect x="${L}" y="${T}" width="${R-L}" height="${B-T}" fill="var(--sheet)"/>
    <g stroke="var(--grid)" stroke-width="1">${[0.25,0.5,0.75,1].map(p=>`<line x1="${L}" y1="${Y(p)}" x2="${R}" y2="${Y(p)}"/>`).join('')}</g>
    ${curW?`<rect x="${X(curW-1)}" y="${T}" width="${(R-L)/16}" height="${B-T}" fill="var(--marker-wash)" opacity="0.6"/>`:''}
    <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="var(--ink)" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="var(--ink)" stroke-width="2"/>
    <g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" fill="var(--ink-soft)" text-anchor="end">${[0,0.25,0.5,0.75,1].map(p=>`<text x="${L-8}" y="${Y(p)+4}">${p*100}%</text>`).join('')}</g>
    <text transform="translate(16 ${(T+B)/2}) rotate(-90)" text-anchor="middle" font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink)">Curriculum learned</text>
    <g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" fill="var(--ink-soft)" text-anchor="middle">${[1,3,5,7,9,11,13,15].map(w=>`<text x="${X(w)-(R-L)/32}" y="268">W${w}</text>`).join('')}</g>
    <text x="${R}" y="268" text-anchor="end" font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink)">Week</text>
    <line x1="${L}" y1="${B}" x2="${R}" y2="${T}" stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 6"/>
    ${pts.length>1&&!empty?`<polyline class="${drawn?'':'drawn'}" style="--len:${Math.ceil(len)+2}" points="${poly}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    <circle cx="${cx}" cy="${cy}" r="7" fill="var(--marker)" stroke="var(--ink)" stroke-width="2"/>
    ${empty?`<g font-family="Shantell Sans, cursive" font-size="16" fill="var(--ink)"><text x="${L+90}" y="${B-78}">${esc(emptyMsg[0])}</text><text x="${L+90}" y="${B-56}">${esc(emptyMsg[1])}</text></g><path d="M ${L+84} ${B-62} C ${L+50} ${B-58}, ${cx+30} ${cy-30}, ${cx+9} ${cy-10}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M ${cx+9} ${cy-10} l 1 -11 M ${cx+9} ${cy-10} l 10 -4" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`
      :`<path d="${curveTo}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="${head}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <g font-family="Shantell Sans, cursive" font-size="16" fill="var(--ink)" text-anchor="${anchor}"><text x="${tx}" y="${ty}">you: ${pct(now)} learned,</text><text x="${tx}" y="${ty+20}">${esc(pace())}</text></g>`}
    <g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">${cps}</g>
  </svg></div>`;
}
/* One-line answer to "how am I doing", shown next to the chart title. */

function help(){

/* Today: one primary action first, then the week, then the curve */
function nextSession(n){

}

  return `
  <div class="pagehead"><div><h1>16-week roadmap</h1><p class="soft">${pct(now)} of the curriculum learned, ${esc(pace())}.</p></div></div>
  <div class="sheet single"><div class="main">${chart()}<p class="soft small">Each week has 6 daily sessions and a weekly project with 6 steps. Each of those 192 items moves the line up about half a percent. Below the dashed plan line means behind schedule, above it means ahead. C1 to C5 are checkpoints you pass with evidence, not with calendar time.</p></div></div>
  <div class="sheet single"><div class="main" style="gap:0">
    <div class="filters"><div class="field"><label for="roadSearch">Search weeks, lessons and keywords</label><input class="input" type="search" id="roadSearch" value="${esc(ui.query)}" placeholder="SHAP, attention, calibration"/></div><div class="field"><label for="phaseFilter">Phase</label><select class="input" id="phaseFilter"><option value="all">All phases</option>${DATA.phases.map(p=>`<option value="${p.id}" ${ui.filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
    ${phases||'<p class="empty" style="padding-top:20px">nothing matches that search. try a broader word.</p>'}
  </div></div>`;
}

/* Practice */
function pagePractice(){
  const w=week(ui.week);
  return `
  <div class="pagehead"><div><h1>Practice</h1><p class="soft">Answer without notes first. Explanations appear after you check.</p></div><div style="min-width:min(100%,360px)">${weekSelect('practiceWeek')}</div></div>
  <div class="subtabs" role="group" aria-label="Practice mode"><button data-practice="quiz" aria-pressed="${ui.practice==='quiz'}">Knowledge check</button><button data-practice="flash" aria-pressed="${ui.practice==='flash'}">Flashcards</button></div>
  ${ui.practice==='quiz'?practiceQuiz(w):practiceFlash(w)}`;
}
function practiceQuiz(w){
  let correct=0,answered=0;
  const cards=w.questions.map((q,i)=>{
    const a=state.answers[wkey(w.n,i)]||{},sel=a.choice,sub=a.submitted;
    if(sub){answered++;if(sel===q[2])correct++}
    return `<div class="index"><p class="q">${i+1}. ${esc(q[0])}</p>
      <div role="radiogroup" aria-label="Question ${i+1}">${q[1].map((o,j)=>`<label class="opt ${sub&&j===q[2]?'right':''} ${sub&&sel===j&&j!==q[2]?'wrong':''}"><input type="radio" name="quiz${w.n}-${i}" data-quiz="${w.n}:${i}:${j}" ${sel===j?'checked':''} ${sub?'disabled':''}/><span>${esc(o)}</span></label>`).join('')}</div>
      ${sub?`<p class="verdict" style="color:${sel===q[2]?'var(--ok)':'var(--bad)'}">${sel===q[2]?'correct.':'not quite.'} ${esc(q[3])}</p>`:`<div class="btnrow"><button class="btn small" data-submitquiz="${w.n}:${i}" ${sel===undefined?'disabled':''}>Check answer</button></div>`}
    </div>`;
  }).join('');
  return `<div class="cards">${cards}</div>
  <div class="sheet single"><div class="main"><div class="rowhead"><h2>Week ${w.n} score</h2><span class="num"><b>${correct}</b> <span class="soft">of ${w.questions.length} correct, ${answered} checked</span></span></div>
    <p class="soft small">Two questions are a warm-up, not the full weekly exam. The exit criterion also asks for implementation and explanation.</p>
    ${boxnote('Exit criterion',w.passTest,'exit')}
    <div class="btnrow"><button class="btn small line" data-action="resetQuiz">Retry these questions</button><button class="btn small line" data-week-today="${w.n}">Back to week ${w.n}</button></div></div></div>`;
}
function practiceFlash(w){
  const i=Math.min(ui.flashIdx,w.cards.length-1),c=w.cards[i],rating=state.flash[wkey(w.n,i)];
  const known=w.cards.filter((_,x)=>state.flash[wkey(w.n,x)]==='known').length,total=Object.values(state.flash).filter(x=>x==='known').length;
  return `<div class="cards"><div class="block">
    <button class="flash" data-action="flipFlash" aria-label="Flip card">${ui.flipped?`<span class="soft small">Answer</span><span class="def">${esc(c[1])}</span>`:`<span class="soft small">Recall the definition</span><span class="term">${esc(c[0])}</span>`}</button>
    <div class="rowhead"><span class="soft small">Card ${i+1} of ${w.cards.length}${rating?`, marked ${rating==='known'?'can explain':'review again'}`:''}</span><span class="btnrow"><button class="btn small line" data-action="prevFlash" ${i===0?'disabled':''}>Previous</button><button class="btn small line" data-action="nextFlash" ${i===w.cards.length-1?'disabled':''}>Next</button></span></div>
    <div class="btnrow"><button class="btn line" data-grade="review">Review again</button><button class="btn" data-grade="known">I can explain it</button></div>
  </div>
  <div class="sheet single"><div class="main"><h2>Confidence</h2>
    <div class="block"><div class="rowhead"><span>This week</span><b class="num">${known} of ${w.cards.length}</b></div><div class="meter" aria-hidden="true"><span style="width:${known/w.cards.length*100}%"></span></div></div>
    <div class="block"><div class="rowhead"><span>Whole run</span><b class="num">${total} of 32</b></div><div class="meter" aria-hidden="true"><span style="width:${total/32*100}%"></span></div></div>
    <p class="soft small">Cover the answer, explain it aloud, then flip. Mark it known only when your explanation is accurate and specific. Revisit on day 1, 3, 7 and 30.</p></div></div></div>`;
}

/* Hours */
function pageHours(){
  const n=ui.week,wh=weekHours(n),logs=state.logs.filter(l=>Number(l.week)===n).sort((a,b)=>b.date.localeCompare(a.date));
  const X=i=>56+(i-1)*41,Y=h=>200-Math.min(h,24)/24*170;
  const bars=DATA.weeks.map(w=>{const h=weekHours(w.n);return `<rect x="${X(w.n)-13}" y="${Y(h)}" width="26" height="${200-Y(h)}" fill="${w.n===n?'var(--marker)':'var(--ink)'}"/><text x="${X(w.n)}" y="218">${w.n}</text>`}).join('');
  return `
  <div class="pagehead"><div><h1>Study hours</h1><p class="soft num">${fmt(totalHours())} of ${DATA.fullHours} planned hours logged</p></div><div style="min-width:min(100%,360px)">${weekSelect('hoursWeek')}</div></div>
  <div class="sheet">
    <div class="main">
      <div class="block"><h2>Hours per week</h2>
        <div class="chartbox" role="img" aria-label="Bar chart of logged study hours for each of the 16 weeks against the ${DATA.coreHours} hour core target"><svg viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg">
          <rect x="32" y="30" width="672" height="170" fill="var(--sheet)"/>
          <line x1="32" y1="${Y(DATA.coreHours)}" x2="704" y2="${Y(DATA.coreHours)}" stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 6"/>
          <text x="704" y="${Y(DATA.coreHours)-6}" text-anchor="end" font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" fill="var(--plan)">${DATA.coreHours} h core</text>
          <line x1="32" y1="200" x2="704" y2="200" stroke="var(--ink)" stroke-width="2"/>
          <g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12" fill="var(--ink-soft)" text-anchor="middle">${bars}</g>
        </svg></div></div>
      <div class="block"><div class="rowhead"><h2>Week ${n} sessions</h2><span class="soft small num">${fmt(wh)} h of ${DATA.weeklyTarget} target</span></div>
        ${logs.length?`<div class="entries">${logs.map(l=>`<div class="entry"><span class="small">${shortDate(l.date)}</span><span>${esc(l.category)}${l.note?`<br><span class="soft small">${esc(l.note)}</span>`:''}</span><b class="num">${fmt(l.hours)} h</b><button class="iconbtn" data-del-log="${esc(l.id)}" aria-label="Delete this entry">${svgIcon('<path d="M6 6l12 12M18 6L6 18"/>',18)}</button></div>`).join('')}</div>`:'<p class="empty">no hours logged for this week yet. log your first session on the right.</p>'}</div>
      <div class="block"><h2>Weekly rhythm</h2><ol class="numbered"><li><span>Monday to Friday, 2 hours: theory, scratch coding, exercises, review.</span></li><li><span>Saturday, 5 hours: project work, write-up and the weekly test.</span></li><li><span>Sunday: rest. Flashcards optional.</span></li><li><span>Stretch: 2.5 to 5 extra hours for research or remediation.</span></li></ol></div>
    </div>
    <aside class="margin" aria-label="Log a session">
      <form class="block" id="logForm"><h3>Log a session</h3><p class="soft small">Enter focused time after studying. Ticking checklists does not add hours.</p>
        <div class="fields">
          <div class="field"><label for="logDate">Date</label><input class="input" type="date" id="logDate" name="date" value="${todayLocal()}" required/></div>
          <div class="field"><label for="logHours">Hours</label><input class="input" type="number" id="logHours" name="hours" min="0.25" max="12" step="0.25" value="2" required/></div>
          <div class="field wide"><label for="logWeek">Week</label><select class="input" id="logWeek" name="week">${DATA.weeks.map(w=>`<option value="${w.n}" ${w.n===n?'selected':''}>Week ${w.n}</option>`).join('')}</select></div>
          <div class="field wide"><label for="logType">Category</label><select class="input" id="logType" name="category">${studyHours.map(h=>`<option>${h}</option>`).join('')}</select></div>
          <div class="field wide"><label for="logNote">What you did (optional)</label><input class="input" id="logNote" name="note" maxlength="180" placeholder="Implemented logistic regression gradient"/></div>
        </div>
        <div class="btnrow"><button class="btn" type="submit">Log session</button></div></form>
    </aside>
  </div>`;
}

/* More */
function pageMore(){
  const groups=DATA.phases.map(p=>`<div class="block"><h2>${esc(p.name)}</h2><div class="links">${DATA.resources.filter(r=>r.phase===p.id).map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(r.name)}</b><span>${esc(r.description)}</span></a>`).join('')}</div></div>`).join('');
  return `
  <div class="pagehead"><div><h1>Resources and backup</h1><p class="soft">A short list of sources per phase, and the controls for your saved progress.</p></div></div>
  <div class="sheet single"><div class="main"><div class="res">${groups}</div></div></div>
  <div class="sheet">
    <div class="main"><div class="block"><h2>For every concept</h2><ol class="numbered">${['Explain what it is and why it exists','Write the essential equation or objective','Implement or demonstrate it','Choose when to apply it','Identify limitations and failure modes','Recall it without consulting notes'].map(t=>`<li><span>${t}</span></li>`).join('')}</ol>
      ${boxnote('What passing means','Explaining, implementing, evaluating and debugging a concept. Watching a tutorial or finishing a notebook is not enough.','exit')}</div></div>
    <aside class="margin"><div class="block"><h3>Review spacing</h3><ol class="numbered">${[['Day 0','learn and implement'],['Day 1','recall without notes'],['Day 3','rebuild the key idea'],['Day 7','quiz and debug'],['Day 30','review and apply']].map(t=>`<li><span><b>${t[0]}</b>, ${t[1]}</span></li>`).join('')}</ol><p class="soft small">A guideline. Repeat hard concepts more often.</p></div></aside>
  </div>
  <div class="sheet single"><div class="main" style="gap:0">
    <div class="setting"><h2>Backup</h2><p class="soft">Progress saves to the cloud while you are signed in. The backup file holds checklists, lesson topics, notes, hours, quiz answers and checkpoints.</p><div class="btnrow"><button class="btn" data-action="export">Download backup</button><button class="btn line" data-action="import">Restore from backup</button><button class="btn line" data-action="print">Print this screen</button></div></div>
    <div class="setting"><h2>What is saved</h2><div class="chips"><span class="chip num">${boolCount(state.tasks)} tasks</span><span class="chip num">${boolCount(state.days)} sessions</span><span class="chip num">${boolCount(state.lessonTopics)} topics</span><span class="chip num">${state.logs.length} time entries</span><span class="chip num">${Object.values(state.notes).filter(Boolean).length+Object.values(state.dayNotes).filter(Boolean).length} notes</span><span class="chip num">${Object.keys(state.answers).length} quiz answers</span><span class="chip num">${boolCount(state.milestones)} checkpoint criteria</span></div></div>
    <div class="setting"><h2>Reset</h2><p class="soft">Clears every checkbox, note and hour, here and in the cloud on the next sync. Download a backup first if you want to keep anything.</p><div class="btnrow"><button class="btn danger" data-action="reset">Reset all progress</button></div></div>
  </div></div>`;
}

const googleLink=q=>`https://www.google.com/search?q=${encodeURIComponent(q)}`;
const youtubeLink=q=>`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

function renderNav(){
  const active=ui.page==='lesson'?(ui.returnPage==='hours'?'hours':ui.returnPage==='roadmap'?'roadmap':'today'):ui.page;
  $('tabs').innerHTML=PAGES.map(([id,label])=>`<button class="tab" data-page="${id}" ${active===id?'aria-current="page"':''}>${label}</button>`).join('');
  $('bottomnav').innerHTML=PAGES.map(([id,label])=>`<button data-page="${id}" ${active===id?'aria-current="page"':''}>${svgIcon(ICONS[id])}${label}</button>`).join('');
  const acc=learnedAll().toFixed(3),epoch=CAL.status==='before'?0:CAL.week;
  document.title=`ML Reboot, epoch ${epoch}/16, acc ${acc}`;
}
function render(){
  renderNav();
  const pages={today:pageToday,lesson:pageLesson,roadmap:pageRoadmap,practice:pagePractice,hours:pageHours,more:pageMore};
  $('content').innerHTML=(pages[ui.page]||pageToday)();
  drawn=true;
  document.querySelectorAll('.chartbox[data-focus]').forEach(box=>{if(box.scrollWidth>box.clientWidth)box.scrollLeft=box.scrollWidth*Number(box.dataset.focus)-box.clientWidth*0.35});
  if(ui.focusWeek){const el=$('week-'+ui.focusWeek);ui.focusWeek=null;if(el)el.scrollIntoView({block:'start'})}
}
function navigate(page){ui.page=page;render();window.scrollTo({top:0})}
function setWeek(n,page){ui.week=Math.min(16,Math.max(1,Number(n)||1));ui.flashIdx=0;ui.flipped=false;if(page)ui.page=page;render();window.scrollTo({top:0})}
function openDay(n,d){const num=Number(n),day=Number(d);if(num<1||num>16||day<0||day>5)return;if(ui.page!=='lesson')ui.returnPage=['roadmap','hours'].includes(ui.page)?ui.page:'today';ui.week=num;ui.lessonDay=day;ui.page='lesson';render();window.scrollTo({top:0})}
function switchLesson(dir){const idx=(ui.week-1)*6+ui.lessonDay+Number(dir);if(idx>=0&&idx<96)openDay(Math.floor(idx/6)+1,idx%6)}

function exportJson(){const exported={application:'ML / REBOOT',version:1,exportedAt:new Date().toISOString(),state};const data=new Blob([JSON.stringify(exported,null,2)],{type:'application/json'});const href=URL.createObjectURL(data);const a=document.createElement('a');a.href=href;a.download=`ml-reboot-progress-${todayLocal()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);notify('Backup downloaded.')}
function validateImport(d){if(!d||d.application!=='ML / REBOOT'||d.version!==1||!d.state||typeof d.state!=='object')throw new Error('This is not a compatible ML Reboot backup.');const s=d.state;if(!Array.isArray(s.logs)||typeof s.tasks!=='object'||typeof s.days!=='object')throw new Error('Backup structure is incomplete.');return{...newState(),...s,logs:s.logs.filter(x=>x&&typeof x==='object').slice(0,20000)}}
function copyText(txt,done){const ok=()=>notify(done),fail=()=>fallbackCopy(txt,done);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fail);else fail()}
function fallbackCopy(txt,done){const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();try{document.execCommand('copy');notify(done)}catch(e){console.error('Copy failed',e);notify('Could not copy. Select the text manually.')}a.remove()}
function quickLog(h){const n=ui.week;state.logs.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),week:n,hours:h,date:todayLocal(),category:'Other',note:'Quick log'});save();render();notify(`${fmt(h)} hour${h===1?'':'s'} logged for week ${n}.`)}
function toggleDay(n,d){const k=dayKey(n,d);state.days[k]=!state.days[k];save();render();notify(state.days[k]?`${weekdays[d]} session marked done.`:`${weekdays[d]} session marked not done.`)}

function handleAction(t){
  switch(t.dataset.action){
    case 'searchGoogle':{const q=$('topicSearchInput')?.value.trim();if(q)window.open(googleLink(q),'_blank','noopener,noreferrer');break}
    case 'searchYouTube':{const q=$('topicSearchInput')?.value.trim();if(q)window.open(youtubeLink(q),'_blank','noopener,noreferrer');break}
    case 'backLesson':navigate(ui.returnPage);break;
    case 'copyKeywords':copyText(lesson(ui.week,ui.lessonDay).keywords.join(', '),'Keywords copied.');break;
    case 'toggleLesson':toggleDay(ui.week,ui.lessonDay);break;
    case 'logLesson':navigate('hours');break;
    case 'export':exportJson();break;
    case 'import':$('importFile').click();break;
    case 'print':window.print();break;
    case 'reset':if(confirm('Reset ALL saved study progress? This replaces your cloud progress on sync and cannot be undone without a backup.')){state=newState();save();render();notify('Progress reset.')}break;
    case 'flipFlash':ui.flipped=!ui.flipped;render();break;
    case 'prevFlash':ui.flashIdx=Math.max(0,ui.flashIdx-1);ui.flipped=false;render();break;
    case 'nextFlash':ui.flashIdx=Math.min(week(ui.week).cards.length-1,ui.flashIdx+1);ui.flipped=false;render();break;
    case 'resetQuiz':if(confirm('Clear submitted answers for this week and try again?')){for(let i=0;i<week(ui.week).questions.length;i++)delete state.answers[wkey(ui.week,i)];save();render()}break;
    case 'askCheckpoint':{const m=DATA.milestones.find(x=>x.week===Number(t.dataset.which));if(!m)break;const txt=`AI/ML skills assessment: ${m.name}. Test me against these criteria, one question and implementation challenge at a time:\n${m.criteria.map((c,i)=>`${i+1}. ${c}`).join('\n')}\nPassing standard: ${m.required}`;copyText(txt,'Assessment prompt copied.');break}
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-page],[data-open-day],[data-lesson-switch],[data-step],[data-week-today],[data-week-practice],[data-toggle-day],[data-quicklog],[data-action],[data-practice],[data-submitquiz],[data-grade],[data-del-log]');
  if(!el||el.disabled)return;
  const ds=el.dataset;
  if(ds.page)return navigate(ds.page);
  if(ds.openDay){const[n,d]=ds.openDay.split(':').map(Number);return openDay(n,d)}
  if(ds.lessonSwitch)return switchLesson(ds.lessonSwitch);
  if(ds.step)return setWeek(ui.week+Number(ds.step));
  if(ds.weekToday)return setWeek(ds.weekToday,'today');
  if(ds.weekPractice)return setWeek(ds.weekPractice,'practice');
  if(ds.toggleDay){const[n,d]=ds.toggleDay.split(':').map(Number);return toggleDay(n,d)}
  if(ds.quicklog)return quickLog(Number(ds.quicklog));
  if(ds.practice){ui.practice=ds.practice;ui.flipped=false;return render()}
  if(ds.submitquiz){const[n,i]=ds.submitquiz.split(':').map(Number);const a=state.answers[wkey(n,i)];if(a&&a.choice!==undefined){a.submitted=true;save();render()}return}
  if(ds.grade){state.flash[wkey(ui.week,ui.flashIdx)]=ds.grade;save();if(ui.flashIdx<week(ui.week).cards.length-1){ui.flashIdx++;ui.flipped=false}return render()}
  if(ds.delLog){if(confirm('Delete this time entry?')){state.logs=state.logs.filter(l=>String(l.id)!==ds.delLog);save();render();notify('Time entry deleted.')}return}
  handleAction(el);
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.lessonTopic||ds.exercise){
    if(ds.lessonTopic)state.lessonTopics[ds.lessonTopic]=t.checked;else (state.exercises=state.exercises||{})[ds.exercise]=t.checked;
    const[n,d]=(ds.lessonTopic||ds.exercise).split(':').map(Number),l=lesson(n,d);
    if(t.checked&&lessonCount(n,d)===l.topics.length&&exerciseCount(n,d)===l.exercises.length&&!state.days[dayKey(n,d)]){state.days[dayKey(n,d)]=true;notify(`Every topic and exercise is ticked, so the ${weekdays[d]} session is marked done.`)}
    save();render();return;
  }
  if(ds.task||ds.day||ds.mile){const kind=ds.task?'tasks':ds.day?'days':'milestones';const[n,i]=(ds.task||ds.day||ds.mile).split(':');state[kind][wkey(n,i)]=t.checked;save();render();return}
  if(ds.quiz){const[n,i,j]=ds.quiz.split(':').map(Number);state.answers[wkey(n,i)]={choice:j,submitted:false};save();render();return}
  if(ds.note!==undefined&&t.tagName==='TEXTAREA'){state.notes[ds.note]=t.value;save();notify('Week notes saved.');return}
  if(ds.daynote){state.dayNotes[ds.daynote]=t.value;save();notify('Session notes saved.');return}
  if(t.hasAttribute('data-select-week'))return setWeek(t.value);
  if(t.id==='phaseFilter'){ui.filter=t.value;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='roadSearch'){ui.query=e.target.value;const p=e.target.selectionStart;render();const f=$('roadSearch');f.focus();try{f.setSelectionRange(p,p)}catch(_){}}});
document.addEventListener('toggle',e=>{
  const d=e.target;if(!(d instanceof HTMLDetailsElement))return;
  if(d.dataset.wk){const n=Number(d.dataset.wk);const had=ui.open.has(n);if(d.open)ui.open.add(n);else ui.open.delete(n);if(d.open&&!had&&!d.querySelector('.body')){d.insertAdjacentHTML('beforeend',weekDetail(week(n)))}}
  if(d.dataset.cp){const n=Number(d.dataset.cp);const had=ui.openCp.has(n);if(d.open)ui.openCp.add(n);else ui.openCp.delete(n);if(d.open&&!had&&!d.querySelector('.body')){const m=DATA.milestones.find(x=>x.week===n);d.insertAdjacentHTML('beforeend',`<div class="body">${checkpointBlock(m,false)}${boxnote('Passing standard',m.required,'exit')}</div>`)}}
},true);
document.addEventListener('submit',e=>{
  if(e.target.id!=='logForm')return;e.preventDefault();
  const f=new FormData(e.target),h=Number(f.get('hours')),n=Number(f.get('week')),date=String(f.get('date'));
  if(!(h>=0.25&&h<=12&&n>=1&&n<=16&&/^\d{4}-\d{2}-\d{2}$/.test(date))){notify('Check the date, week and hours (0.25 to 12).');return}
  state.logs.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),week:n,hours:h,date,category:String(f.get('category')),note:String(f.get('note')||'').slice(0,180)});
  ui.week=n;save();render();notify(`${fmt(h)} hour${h===1?'':'s'} logged for week ${n}.`);
});
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=validateImport(JSON.parse(await file.text()));if(confirm('Replace your current progress with this backup? It will sync to the cloud.')){state=data;save();render();notify('Progress restored from backup.')}}catch(err){console.error('Import failed',err);alert('Could not import: '+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{const x=document.activeElement;if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(x?.tagName)&&ui.page==='roadmap'){e.preventDefault();$('roadSearch')?.focus()}});

render();
syncCloudOnLoad();
</script>
</body>
</html>
