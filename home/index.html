<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaky Ashari</title>
    <meta name="description" content="Zaky Ashari: AI/ML engineer, software engineer and business.">
    <!-- New landing page in progress; keep it out of search results until it replaces /. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#dbd5c9">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <!-- Apply the saved colour mode before first paint (light by default); src/home/HomeApp.jsx owns it afterwards. -->
    <script>
        try {
            if (localStorage.getItem('zashari-home-theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
                document.querySelector('meta[name="theme-color"]').content = '#202020';
            }
        } catch {
            // Storage blocked (private mode, site data off): stay on the light default.
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/home/main.jsx"></script>
</body>
</html>
