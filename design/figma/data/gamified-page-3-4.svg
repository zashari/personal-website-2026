<text id="text-1" fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="562" y="44">Back </tspan><tspan x="591.253" y="44">in </tspan><tspan x="606.17" y="44">December </tspan><tspan x="660.97" y="44">2025, </tspan><tspan x="696.307" y="44">a </tspan><tspan x="708.959" y="44">heavy </tspan><tspan x="562" y="55">obsession </tspan><tspan x="612.549" y="55">with </tspan><tspan x="637.189" y="55">a </tspan><tspan x="648.109" y="55">crime-investigation </tspan><tspan x="562" y="66">game </tspan><tspan x="599.105" y="66">sparked </tspan><tspan x="646.698" y="66">an </tspan><tspan x="668.734" y="66">idea: </tspan><tspan x="700.917" y="66">a </tspan><tspan x="717.26" y="66">fully </tspan><tspan x="562" y="77">interactive </tspan><tspan x="621.647" y="77">personal </tspan><tspan x="672.945" y="77">project </tspan><tspan x="716.811" y="77">built </tspan><tspan x="562" y="88">entirely </tspan><tspan x="598.631" y="88">from </tspan><tspan x="623.104" y="88">scratch. </tspan></text>
<text id="text-2" fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="562" y="119">Vibe </tspan><tspan x="591.787" y="119">Coding </tspan><tspan x="633.819" y="119">is </tspan><tspan x="650.198" y="119">Zashari&#39;s </tspan><tspan x="699.525" y="119">ultimate </tspan><tspan x="562" y="130">creative </tspan><tspan x="602.237" y="130">outlet, </tspan><tspan x="634.487" y="130">he </tspan><tspan x="649.959" y="130">loves </tspan><tspan x="677.042" y="130">dreaming </tspan><tspan x="724.604" y="130">up </tspan><tspan x="562" y="141">concepts </tspan><tspan x="610.048" y="141">and </tspan><tspan x="633.018" y="141">bringing </tspan><tspan x="676.584" y="141">them </tspan><tspan x="706.106" y="141">to </tspan><tspan x="720.941" y="141">life. </tspan><tspan x="562" y="152">To </tspan><tspan x="577.763" y="152">nail </tspan><tspan x="598.535" y="152">the </tspan><tspan x="618.644" y="152">gritty </tspan><tspan x="648.928" y="152">aesthetic, </tspan><tspan x="697.835" y="152">he </tspan><tspan x="714.389" y="152">even </tspan><tspan x="562" y="163">used </tspan><tspan x="589.531" y="163">AI </tspan><tspan x="604.327" y="163">to </tspan><tspan x="619.163" y="163">generate </tspan><tspan x="665.795" y="163">paparazzi-style </tspan><tspan x="562" y="174">photos </tspan><tspan x="596.443" y="174">of </tspan><tspan x="608.611" y="174">himself.</tspan></text>
<g id="text-3">
