<g id="project-detail-fraud-left-01">
<rect width="384" height="536" fill="#F7EBD2"/>
<rect id="image" y="233" width="384" height="303" fill="url(#pattern0_2090_441)"/>
<text id="Manual deployment is a thing of the past. To make this system truly scalable, Zashari and his Mentor engineered a custom auto-run system that handled the entire pipeline end-to-end without human intervention." fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="34" y="55">Manual </tspan><tspan x="75.5273" y="55">deployment </tspan><tspan x="34" y="66">is </tspan><tspan x="50.1216" y="66">a </tspan><tspan x="64.7197" y="66">thing </tspan><tspan x="97.0327" y="66">of </tspan><tspan x="115.186" y="66">the </tspan><tspan x="34" y="77">past. </tspan><tspan x="63.4154" y="77">To </tspan><tspan x="81.2585" y="77">make </tspan><tspan x="113.682" y="77">this </tspan><tspan x="34" y="88">system </tspan><tspan x="109.355" y="88">truly </tspan><tspan x="34" y="99">scalable, </tspan><tspan x="76.4727" y="99">Zashari </tspan><tspan x="112.744" y="99">and </tspan><tspan x="34" y="110">his </tspan><tspan x="97.4023" y="110">Mentor </tspan><tspan x="34" y="121">engineered </tspan><tspan x="124.453" y="121">a </tspan><tspan x="34" y="132">custom </tspan><tspan x="90.166" y="132">auto-run </tspan><tspan x="34" y="143">system </tspan><tspan x="70.877" y="143">that </tspan><tspan x="93.3496" y="143">handled </tspan><tspan x="34" y="154">the </tspan><tspan x="58.9678" y="154">entire </tspan><tspan x="94.7852" y="154">pipeline </tspan><tspan x="34" y="165">end-to-end </tspan><tspan x="96.0352" y="165">without </tspan><tspan x="34" y="176">human </tspan><tspan x="68.375" y="176">intervention.</tspan></text>
<text id="From executing the initial data processing to running the heavy model training and finalizing the predictions, everything was heavily automated." fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="142" y="55">From </tspan><tspan x="171.812" y="55">executing </tspan><tspan x="223.186" y="55">the </tspan><tspan x="142" y="66">initial </tspan><tspan x="217.746" y="66">data </tspan><tspan x="142" y="77">processing </tspan><tspan x="228.879" y="77">to </tspan><tspan x="142" y="88">running </tspan><tspan x="186.367" y="88">the </tspan><tspan x="210.959" y="88">heavy </tspan><tspan x="142" y="99">model </tspan><tspan x="178.345" y="99">training </tspan><tspan x="220.744" y="99">and </tspan><tspan x="142" y="110">finalizing </tspan><tspan x="223.186" y="110">the </tspan><tspan x="142" y="121">predictions, </tspan><tspan x="142" y="132">everything </tspan><tspan x="219.768" y="132">was </tspan><tspan x="142" y="143">heavily </tspan><tspan x="176.453" y="143">automated.</tspan></text>
<text id="Once a model was trained and validated against the test data, the system securely pushed the final weights and artifacts straight to MinIO storage. This workflow made the latest, smartest version of the model instantly ready for production inference." fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="250" y="55">Once </tspan><tspan x="281.812" y="55">a </tspan><tspan x="294.835" y="55">model </tspan><tspan x="330.768" y="55">was </tspan><tspan x="250" y="66">trained </tspan><tspan x="286.326" y="66">and </tspan><tspan x="307.828" y="66">validated </tspan><tspan x="250" y="77">against </tspan><tspan x="287.183" y="77">the </tspan><tspan x="305.782" y="77">test </tspan><tspan x="326.529" y="77">data, </tspan><tspan x="250" y="88">the </tspan><tspan x="271.561" y="88">system </tspan><tspan x="310.895" y="88">securely </tspan><tspan x="250" y="99">pushed </tspan><tspan x="299.451" y="99">the </tspan><tspan x="330.143" y="99">final </tspan><tspan x="250" y="110">weights </tspan><tspan x="289.871" y="110">and </tspan><tspan x="311.5" y="110">artifacts </tspan><tspan x="250" y="121">straight </tspan><tspan x="299.231" y="121">to </tspan><tspan x="322.691" y="121">MinIO </tspan><tspan x="250" y="132">storage. </tspan><tspan x="330.367" y="132">This </tspan><tspan x="250" y="143">workflow </tspan><tspan x="299.749" y="143">made </tspan><tspan x="334.186" y="143">the </tspan><tspan x="250" y="154">latest, </tspan><tspan x="308.688" y="154">smartest </tspan><tspan x="250" y="165">version </tspan><tspan x="287.359" y="165">of </tspan><tspan x="301.094" y="165">the </tspan><tspan x="320.543" y="165">model </tspan><tspan x="250" y="176">instantly </tspan><tspan x="299.363" y="176">ready </tspan><tspan x="336.314" y="176">for </tspan><tspan x="250" y="187">production </tspan><tspan x="302.061" y="187">inference.</tspan></text>
</g>
<g id="project-detail-fraud-right-01" clip-path="url(#clip0_2090_441)">
<rect width="384" height="536" transform="translate(384)" fill="#F7EBD2"/>
<text id="The Service Level Agreement (SLA) demanded a minimum 80% recall to consider the project a success. The final model didn&#226;&#128;&#153;t just pass the test; it completely shattered the benchmark, hitting a massive 89% recall. But in the high-stakes finance world, an AI &#34;black box&#34; that just spits out a yes or no doesn&#39;t fly. Real humans need to trust the tech. To bridge that gap, Zashari and his Mentor integrated advanced explainability modules, including feature attribution and full interpretability reports directly into the system. This gave the human Risk Management Division exactly what they needed: the transparent logic behind the AI to confidently make those final approval decisions." fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="414" y="388">The </tspan><tspan x="434.413" y="388">Service </tspan><tspan x="471.534" y="388">Level </tspan><tspan x="497.904" y="388">Agreement </tspan><tspan x="552.008" y="388">(SLA) </tspan><tspan x="581.014" y="388">demanded </tspan><tspan x="633.712" y="388">a </tspan><tspan x="642.542" y="388">minimum </tspan><tspan x="688.121" y="388">80% </tspan><tspan x="713.006" y="388">recall </tspan><tspan x="414" y="399">to </tspan><tspan x="426.608" y="399">consider </tspan><tspan x="469.44" y="399">the </tspan><tspan x="487.741" y="399">project </tspan><tspan x="522.887" y="399">a </tspan><tspan x="531.921" y="399">success. </tspan><tspan x="573.806" y="399">The </tspan><tspan x="594.421" y="399">final </tspan><tspan x="616.765" y="399">model </tspan><tspan x="648.708" y="399">didn&#x2019;t </tspan><tspan x="678.25" y="399">just </tspan><tspan x="697.478" y="399">pass </tspan><tspan x="722.186" y="399">the </tspan><tspan x="414" y="410">test; </tspan><tspan x="437.764" y="410">it </tspan><tspan x="448.023" y="410">completely </tspan><tspan x="503.252" y="410">shattered </tspan><tspan x="551.284" y="410">the </tspan><tspan x="570.683" y="410">benchmark, </tspan><tspan x="629.984" y="410">hitting </tspan><tspan x="663.553" y="410">a </tspan><tspan x="673.685" y="410">massive </tspan><tspan x="715.398" y="410">89% </tspan><tspan x="414" y="421">recall.  </tspan><tspan x="443.297" y="421">&#10;</tspan><tspan x="414" y="432">&#10;</tspan><tspan x="414" y="443">But </tspan><tspan x="432.801" y="443">in </tspan><tspan x="444.513" y="443">the </tspan><tspan x="463.227" y="443">high-stakes </tspan><tspan x="520.632" y="443">finance </tspan><tspan x="558.007" y="443">world, </tspan><tspan x="589.484" y="443">an </tspan><tspan x="604.624" y="443">AI </tspan><tspan x="617.605" y="443">&#34;black </tspan><tspan x="649.385" y="443">box&#34; </tspan><tspan x="673.831" y="443">that </tspan><tspan x="695.913" y="443">just </tspan><tspan x="715.555" y="443">spits </tspan><tspan x="414" y="454">out </tspan><tspan x="431.764" y="454">a </tspan><tspan x="440.377" y="454">yes </tspan><tspan x="459.098" y="454">or </tspan><tspan x="471.734" y="454">no </tspan><tspan x="486.256" y="454">doesn&#39;t </tspan><tspan x="522.516" y="454">fly. </tspan><tspan x="538.414" y="454">Real </tspan><tspan x="560.865" y="454">humans </tspan><tspan x="600.143" y="454">need </tspan><tspan x="626.051" y="454">to </tspan><tspan x="638.238" y="454">trust </tspan><tspan x="662.34" y="454">the </tspan><tspan x="680.221" y="454">tech.&#10;</tspan><tspan x="414" y="465">&#10;</tspan><tspan x="414" y="476">To </tspan><tspan x="430.848" y="476">bridge </tspan><tspan x="466.954" y="476">that </tspan><tspan x="491.517" y="476">gap, </tspan><tspan x="517.76" y="476">Zashari </tspan><tspan x="557.205" y="476">and </tspan><tspan x="580.84" y="476">his </tspan><tspan x="599.984" y="476">Mentor </tspan><tspan x="638.961" y="476">integrated </tspan><tspan x="692.039" y="476">advanced </tspan><tspan x="414" y="487">explainability </tspan><tspan x="485.708" y="487">modules, </tspan><tspan x="538.529" y="487">including </tspan><tspan x="591.516" y="487">feature </tspan><tspan x="635.46" y="487">attribution </tspan><tspan x="694.618" y="487">and </tspan><tspan x="724.041" y="487">full </tspan><tspan x="414" y="498">interpretability </tspan><tspan x="483.955" y="498">reports </tspan><tspan x="521.019" y="498">directly </tspan><tspan x="559.059" y="498">into </tspan><tspan x="580.039" y="498">the </tspan><tspan x="599.047" y="498">system. </tspan><tspan x="638.064" y="498">This </tspan><tspan x="660.89" y="498">gave </tspan><tspan x="686.684" y="498">the </tspan><tspan x="705.691" y="498">human </tspan><tspan x="414" y="509">Risk </tspan><tspan x="436.284" y="509">Management </tspan><tspan x="500.57" y="509">Division </tspan><tspan x="539.212" y="509">exactly </tspan><tspan x="575.656" y="509">what </tspan><tspan x="601.856" y="509">they </tspan><tspan x="625.723" y="509">needed: </tspan><tspan x="665.897" y="509">the </tspan><tspan x="684.227" y="509">transparent </tspan><tspan x="414" y="520">logic </tspan><tspan x="438.746" y="520">behind </tspan><tspan x="472.916" y="520">the </tspan><tspan x="490.797" y="520">AI </tspan><tspan x="502.945" y="520">to </tspan><tspan x="515.133" y="520">confidently </tspan><tspan x="569.215" y="520">make </tspan><tspan x="597.33" y="520">those </tspan><tspan x="625.777" y="520">final </tspan><tspan x="647.701" y="520">approval </tspan><tspan x="689.859" y="520">decisions.   </tspan></text>
