<rect id="Rectangle 11" x="493" y="357" width="244" height="161" fill="black" fill-opacity="0.7"/>
<text id="Data is messy, and fraud data is notoriously imbalanced. To fix this, Zashari implemented advanced oversampling and data balancing techniques. But the real flex was the feature selection. Using a Predictive Power Score (PPS) system, the architecture ruthlessly filtered out useless noise, extracting and selecting only the highest-impact data points&#226;&#128;&#148;ensuring the model was learning from the right signals, not just the loud ones." fill="white" style="white-space: pre" xml:space="preserve" font-family="Times New Normal" font-size="12" letter-spacing="0em"><tspan x="505" y="375.5">Data </tspan><tspan x="531.106" y="375.5">is </tspan><tspan x="542.4" y="375.5">messy, </tspan><tspan x="578.701" y="375.5">and </tspan><tspan x="599.862" y="375.5">fraud </tspan><tspan x="629.964" y="375.5">data </tspan><tspan x="654.335" y="375.5">is </tspan><tspan x="665.629" y="375.5">notoriously </tspan><tspan x="505" y="388.5">imbalanced. </tspan><tspan x="565.642" y="388.5">To </tspan><tspan x="580.253" y="388.5">fix </tspan><tspan x="597.512" y="388.5">this, </tspan><tspan x="620.221" y="388.5">Zashari </tspan><tspan x="659.852" y="388.5">implemented </tspan><tspan x="505" y="401.5">advanced </tspan><tspan x="555.367" y="401.5">oversampling </tspan><tspan x="627.121" y="401.5">and </tspan><tspan x="650.336" y="401.5">data </tspan><tspan x="676.762" y="401.5">balancing </tspan><tspan x="505" y="414.5">techniques. </tspan><tspan x="562.996" y="414.5">But </tspan><tspan x="583.504" y="414.5">the </tspan><tspan x="602.676" y="414.5">real </tspan><tspan x="625.047" y="414.5">flex </tspan><tspan x="648.016" y="414.5">was </tspan><tspan x="669.812" y="414.5">the </tspan><tspan x="688.984" y="414.5">feature </tspan><tspan x="505" y="427.5">selection. </tspan><tspan x="556.265" y="427.5">Using </tspan><tspan x="590.444" y="427.5">a </tspan><tspan x="602.791" y="427.5">Predictive </tspan><tspan x="658.462" y="427.5">Power </tspan><tspan x="696.133" y="427.5">Score </tspan><tspan x="505" y="440.5">(PPS) </tspan><tspan x="537.517" y="440.5">system, </tspan><tspan x="582.104" y="440.5">the </tspan><tspan x="606.452" y="440.5">architecture </tspan><tspan x="675.789" y="440.5">ruthlessly </tspan><tspan x="505" y="453.5">filtered </tspan><tspan x="548.589" y="453.5">out </tspan><tspan x="572.315" y="453.5">useless </tspan><tspan x="612.822" y="453.5">noise, </tspan><tspan x="647.552" y="453.5">extracting </tspan><tspan x="706.609" y="453.5">and </tspan><tspan x="505" y="466.5">selecting </tspan><tspan x="558.074" y="466.5">only </tspan><tspan x="591.367" y="466.5">the </tspan><tspan x="617.84" y="466.5">highest-impact </tspan><tspan x="703.398" y="466.5">data </tspan><tspan x="505" y="479.5">points&#x2014;ensuring </tspan><tspan x="598.275" y="479.5">the </tspan><tspan x="620.828" y="479.5">model </tspan><tspan x="657.83" y="479.5">was </tspan><tspan x="683.008" y="479.5">learning </tspan><tspan x="505" y="492.5">from </tspan><tspan x="536.875" y="492.5">the </tspan><tspan x="559.141" y="492.5">right </tspan><tspan x="591.297" y="492.5">signals, </tspan><tspan x="632.348" y="492.5">not </tspan><tspan x="656.055" y="492.5">just </tspan><tspan x="680.852" y="492.5">the </tspan><tspan x="703.117" y="492.5">loud </tspan><tspan x="505" y="505.5">ones.</tspan></text>
