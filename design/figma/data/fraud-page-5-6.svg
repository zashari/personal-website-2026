<text id="BUILDING THE MACHINE" fill="black" style="white-space: pre" xml:space="preserve" font-family="Open Sans Condensed" font-size="20" font-weight="800" letter-spacing="0em"><tspan x="59.7422" y="49.2773">BUILDING THE </tspan><tspan x="77.6426" y="69.2773">MACHINE</tspan></text>
</g>
<text id="The final solution was an absolute powerhouse. Built on a hardcore, unyielding stack of Python 3.10, Scikit-learn, and XGBoost, the machine learning pipeline was designed to chew through raw, complex data with zero friction. But a model is only as good as its deployment. The backend was powered by Flask, ensuring the API endpoint could seamlessly and securely handle real-time fraud-checking requests directly from Client&#39;s mobile and web applications. Every piece of the architecture was optimized for speed and reliability, creating a true end-to-end ML pipeline that covered everything from raw data preprocessing to final model evaluation." fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="48" y="114">The </tspan><tspan x="73.6909" y="114">final </tspan><tspan x="101.11" y="114">solution </tspan><tspan x="144.965" y="114">was </tspan><tspan x="171.76" y="114">an </tspan><tspan x="48" y="125">absolute </tspan><tspan x="96.2666" y="125">powerhouse. </tspan><tspan x="163.859" y="125">Built </tspan><tspan x="48" y="136">on </tspan><tspan x="69.0514" y="136">a </tspan><tspan x="84.1947" y="136">hardcore, </tspan><tspan x="136.691" y="136">unyielding </tspan><tspan x="48" y="147">stack </tspan><tspan x="76.4204" y="147">of </tspan><tspan x="89.4697" y="147">Python </tspan><tspan x="125.683" y="147">3.10, </tspan><tspan x="153.596" y="147">Scikit-</tspan><tspan x="48" y="158">learn, </tspan><tspan x="85.2331" y="158">and </tspan><tspan x="114.771" y="158">XGBoost, </tspan><tspan x="168.186" y="158">the </tspan><tspan x="48" y="169">machine </tspan><tspan x="99.04" y="169">learning </tspan><tspan x="147.785" y="169">pipeline </tspan><tspan x="48" y="180">was </tspan><tspan x="80.0312" y="180">designed </tspan><tspan x="135.656" y="180">to </tspan><tspan x="158.576" y="180">chew </tspan><tspan x="48" y="191">through </tspan><tspan x="90.5781" y="191">raw, </tspan><tspan x="116.379" y="191">complex </tspan><tspan x="162.746" y="191">data </tspan><tspan x="48" y="202">with </tspan><tspan x="70.334" y="202">zero </tspan><tspan x="92.6387" y="202">friction.&#10;</tspan><tspan x="48" y="213">&#10;</tspan><tspan x="48" y="224">But </tspan><tspan x="67.1406" y="224">a </tspan><tspan x="76.9258" y="224">model </tspan><tspan x="109.621" y="224">is </tspan><tspan x="120.93" y="224">only </tspan><tspan x="144.523" y="224">as </tspan><tspan x="159.26" y="224">good </tspan><tspan x="48" y="235">as </tspan><tspan x="71.877" y="235">its </tspan><tspan x="95.7832" y="235">deployment. </tspan><tspan x="165.871" y="235">The </tspan><tspan x="48" y="246">backend </tspan><tspan x="95.9753" y="246">was </tspan><tspan x="123.072" y="246">powered </tspan><tspan x="171.506" y="246">by </tspan><tspan x="48" y="257">Flask, </tspan><tspan x="87.0983" y="257">ensuring </tspan><tspan x="139.79" y="257">the </tspan><tspan x="168.029" y="257">API </tspan><tspan x="48" y="268">endpoint </tspan><tspan x="98.2832" y="268">could </tspan><tspan x="133.049" y="268">seamlessly </tspan><tspan x="48" y="279">and </tspan><tspan x="74.4746" y="279">securely </tspan><tspan x="121.799" y="279">handle </tspan><tspan x="161.652" y="279">real-</tspan><tspan x="48" y="290">time </tspan><tspan x="112.697" y="290">fraud-checking </tspan><tspan x="48" y="301">requests </tspan><tspan x="107.238" y="301">directly </tspan><tspan x="161.594" y="301">from </tspan><tspan x="48" y="312">Client&#39;s </tspan><tspan x="92.5833" y="312">mobile </tspan><tspan x="134.833" y="312">and </tspan><tspan x="163.762" y="312">web </tspan><tspan x="48" y="323">applications.&#10;</tspan><tspan x="48" y="334">&#10;</tspan><tspan x="48" y="345">Every </tspan><tspan x="93.6217" y="345">piece </tspan><tspan x="138.726" y="345">of </tspan><tspan x="168.186" y="345">the </tspan><tspan x="48" y="356">architecture </tspan><tspan x="111.228" y="356">was </tspan><tspan x="138.322" y="356">optimized </tspan><tspan x="48" y="367">for </tspan><tspan x="72.4336" y="367">speed </tspan><tspan x="112.248" y="367">and </tspan><tspan x="141.252" y="367">reliability, </tspan><tspan x="48" y="378">creating </tspan><tspan x="92.0267" y="378">a </tspan><tspan x="104.393" y="378">true </tspan><tspan x="129.523" y="378">end-to-end </tspan><tspan x="48" y="389">ML </tspan><tspan x="72.222" y="389">pipeline </tspan><tspan x="117.889" y="389">that </tspan><tspan x="146.525" y="389">covered </tspan><tspan x="48" y="400">everything </tspan><tspan x="105.949" y="400">from </tspan><tspan x="136.643" y="400">raw </tspan><tspan x="162.746" y="400">data </tspan><tspan x="48" y="411">preprocessing </tspan><tspan x="117.183" y="411">to </tspan><tspan x="130.995" y="411">final </tspan><tspan x="154.543" y="411">model </tspan><tspan x="48" y="422">evaluation.</tspan></text>
