<text id="text-5" fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="568" y="288">To </tspan><tspan x="581.72" y="288">make </tspan><tspan x="610.02" y="288">Arumi </tspan><tspan x="640.312" y="288">a </tspan><tspan x="649.111" y="288">reality, </tspan><tspan x="681.639" y="288">Zaky </tspan><tspan x="706.619" y="288">actually </tspan><tspan x="568" y="299">took </tspan><tspan x="592.141" y="299">a </tspan><tspan x="601.644" y="299">hiatus </tspan><tspan x="632.631" y="299">from </tspan><tspan x="657.994" y="299">his </tspan><tspan x="674.713" y="299">career </tspan><tspan x="707.898" y="299">in </tspan><tspan x="719.666" y="299">tech. </tspan><tspan x="568" y="310">But </tspan><tspan x="587.87" y="310">it&#x2019;s </tspan><tspan x="606.12" y="310">only </tspan><tspan x="630.443" y="310">temporary&#x2014;he </tspan><tspan x="703.634" y="310">plans </tspan><tspan x="732.879" y="310">to </tspan><tspan x="568" y="321">dive </tspan><tspan x="590.974" y="321">right </tspan><tspan x="616.33" y="321">back </tspan><tspan x="642.654" y="321">into </tspan><tspan x="663.567" y="321">the </tspan><tspan x="682.508" y="321">development </tspan><tspan x="568" y="332">world </tspan><tspan x="599.072" y="332">once </tspan><tspan x="627.283" y="332">the </tspan><tspan x="647.808" y="332">coffee </tspan><tspan x="682.346" y="332">shop </tspan><tspan x="710.479" y="332">is </tspan><tspan x="723.26" y="332">fully </tspan><tspan x="568" y="343">self-sustaining.</tspan></text>
<text id="text-4" fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="568" y="177">Today, </tspan><tspan x="600.228" y="177">Zaky </tspan><tspan x="625.454" y="177">manages </tspan><tspan x="671.149" y="177">the </tspan><tspan x="689.461" y="177">day-to-day </tspan><tspan x="568" y="188">chaos, </tspan><tspan x="602.036" y="188">from </tspan><tspan x="628.026" y="188">daily </tspan><tspan x="654.093" y="188">operations </tspan><tspan x="707.016" y="188">and </tspan><tspan x="728.855" y="188">HR </tspan><tspan x="568" y="199">to </tspan><tspan x="585.233" y="199">social </tspan><tspan x="619.272" y="199">media </tspan><tspan x="655.626" y="199">and </tspan><tspan x="680.994" y="199">infrastructure </tspan><tspan x="568" y="210">design. </tspan><tspan x="617.904" y="210">The </tspan><tspan x="652.457" y="210">vision? </tspan><tspan x="700.818" y="210">Constant </tspan><tspan x="568" y="221">evolution. </tspan><tspan x="619.942" y="221">Arumi </tspan><tspan x="655.947" y="221">Coffee </tspan><tspan x="695.194" y="221">is </tspan><tspan x="711.229" y="221">always </tspan><tspan x="568" y="232">upgrading </tspan><tspan x="618.724" y="232">its </tspan><tspan x="633.266" y="232">space </tspan><tspan x="664.644" y="232">and </tspan><tspan x="685.915" y="232">tweaking </tspan><tspan x="731.473" y="232">its </tspan><tspan x="568" y="243">menu </tspan><tspan x="596.917" y="243">to </tspan><tspan x="609.321" y="243">keep </tspan><tspan x="634.693" y="243">the </tspan><tspan x="652.79" y="243">community </tspan><tspan x="707.752" y="243">coming </tspan><tspan x="568" y="254">back </tspan><tspan x="593.264" y="254">for </tspan><tspan x="609.016" y="254">more.</tspan></text>
<g id="text-3">
<text fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="568" y="44">But </tspan><tspan x="587.213" y="44">he&#39;s </tspan><tspan x="609.737" y="44">the </tspan><tspan x="628.863" y="44">first </tspan><tspan x="650.498" y="44">to </tspan><tspan x="663.93" y="44">admit </tspan><tspan x="694.423" y="44">it&#x2019;s </tspan><tspan x="712.015" y="44">a </tspan><tspan x="721.873" y="44">total </tspan><tspan x="568" y="55">team </tspan><tspan x="596.702" y="55">effort. </tspan><tspan x="629.272" y="55">His </tspan><tspan x="648.423" y="55">brother </tspan><tspan x="742" y="55"> </tspan><tspan x="568" y="66">built </tspan><tspan x="594.618" y="66">the </tspan><tspan x="616.862" y="66">custom </tspan><tspan x="658.002" y="66">POS </tspan><tspan x="684.727" y="66">system </tspan><tspan x="724.744" y="66">and </tspan><tspan x="568" y="77">helped </tspan><tspan x="602.357" y="77">fund </tspan><tspan x="626.166" y="77">the </tspan><tspan x="644.361" y="77">vision </tspan><tspan x="673.903" y="77">alongside </tspan><tspan x="721.258" y="77">their </tspan><tspan x="568" y="88">parents. </tspan><tspan x="677.49" y="88"> </tspan><tspan x="685.214" y="88">and </tspan><tspan x="596.701" y="99"> </tspan><tspan x="602.237" y="99">brought </tspan><tspan x="643.398" y="99">serious </tspan><tspan x="681.376" y="99">F&#38;B </tspan><tspan x="705.018" y="99">industry </tspan><tspan x="568" y="110">experience </tspan><tspan x="624.515" y="110">to </tspan><tspan x="639.467" y="110">lock </tspan><tspan x="663.961" y="110">down </tspan><tspan x="694.997" y="110">the </tspan><tspan x="715.643" y="110">SOPs, </tspan><tspan x="568" y="121">while </tspan><tspan x="594.966" y="121">his </tspan><tspan x="611.141" y="121">younger </tspan><tspan x="652.404" y="121">brother </tspan><tspan x="742" y="121"> </tspan><tspan x="568" y="132">is </tspan><tspan x="578.637" y="132">the </tspan><tspan x="597.019" y="132">creative </tspan><tspan x="636.611" y="132">force </tspan><tspan x="663.411" y="132">behind </tspan><tspan x="698.081" y="132">the </tspan><tspan x="716.463" y="132">visual </tspan><tspan x="568" y="143">identity </tspan><tspan x="605.246" y="143">and </tspan><tspan x="625.568" y="143">the </tspan><tspan x="643.449" y="143">iconic </tspan><tspan x="673.166" y="143">Arumi </tspan><tspan x="703.273" y="143">logo.</tspan></text>
<text fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="bold" letter-spacing="0em"><tspan x="687.399" y="55">Andi </tspan><tspan x="713.299" y="55">Ashari</tspan><tspan x="612.306" y="88">Kintha </tspan><tspan x="648.789" y="88">Ashari</tspan><tspan x="710.193" y="88">Nadine </tspan><tspan x="568" y="99">Ashari</tspan><tspan x="689.458" y="121">Izzat </tspan><tspan x="713.299" y="121">Ashari</tspan></text>
</g>
<text id="text-2" fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="461" y="455">It&#x2019;s </tspan><tspan x="488.703" y="455">his </tspan><tspan x="515.664" y="455">dream </tspan><tspan x="461" y="466">since </tspan><tspan x="495.583" y="466">in </tspan><tspan x="514.17" y="466">middle </tspan><tspan x="461" y="477">school </tspan><tspan x="498.961" y="477">to </tspan><tspan x="516.326" y="477">run </tspan><tspan x="539.453" y="477">a </tspan><tspan x="461" y="488">business </tspan><tspan x="503.197" y="488">he </tspan><tspan x="517.523" y="488">said.</tspan></text>
<g id="text-1">
<text id="Zashari wears a lot of hats here. He spearheaded the R&#38;D behind some of Arumi&#226;&#128;&#153;s most hyped signature drinks, including the Mont Blanc, Berry Manuka Americano, and Honey" fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="422" y="44">Zashari </tspan><tspan x="458.512" y="44">wears </tspan><tspan x="489.165" y="44">a </tspan><tspan x="498.157" y="44">lot </tspan><tspan x="512.97" y="44">of </tspan><tspan x="525.518" y="44">hats </tspan><tspan x="422" y="55">here. </tspan><tspan x="448.775" y="55">He </tspan><tspan x="465.589" y="55">spearheaded </tspan><tspan x="530.186" y="55">the </tspan><tspan x="422" y="66">R&#38;D </tspan><tspan x="454.667" y="66">behind </tspan><tspan x="498.222" y="66">some </tspan><tspan x="535.898" y="66">of </tspan><tspan x="422" y="77">Arumi&#x2019;s </tspan><tspan x="475.062" y="77">most </tspan><tspan x="516.475" y="77">hyped </tspan><tspan x="422" y="88">signature </tspan><tspan x="469.34" y="88">drinks, </tspan><tspan x="504.18" y="88">including </tspan><tspan x="422" y="99">the </tspan><tspan x="447.788" y="99">Mont </tspan><tspan x="482.18" y="99">Blanc, </tspan><tspan x="520.176" y="99">Berry </tspan><tspan x="422" y="110">Manuka </tspan><tspan x="466.942" y="110">Americano, </tspan><tspan x="527.744" y="110">and </tspan><tspan x="422" y="121">Honey</tspan></text>
<text id="Tea Blanc." fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="496.104" y="121"> Tea Blanc.</tspan></text>
