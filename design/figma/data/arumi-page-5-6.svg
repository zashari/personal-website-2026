<text id="Arumi Coffee opened its doors on June 19, 2026. Zashari actually never intended to go all-in on this project. It wasn&#39;t until a trip back to his hometown of Palu in March 2026, and a pivotal late-night conversation with his family that everything shifted. After three months of grinding, Arumi Coffee launched with a raw, minimalist open-bar concept." fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="26" y="400">Arumi </tspan><tspan x="58.293" y="400">Coffee </tspan><tspan x="93.8281" y="400">opened </tspan><tspan x="133.699" y="400">its </tspan><tspan x="149.479" y="400">doors </tspan><tspan x="180.707" y="400">on </tspan><tspan x="197.414" y="400">June </tspan><tspan x="223.32" y="400">19, </tspan><tspan x="243.797" y="400">2026. </tspan><tspan x="277.301" y="400">Zashari </tspan><tspan x="315.619" y="400">actually </tspan><tspan x="26" y="411">never </tspan><tspan x="54.8504" y="411">intended </tspan><tspan x="98.1638" y="411">to </tspan><tspan x="110.715" y="411">go </tspan><tspan x="126.109" y="411">all-in </tspan><tspan x="152.039" y="411">on </tspan><tspan x="166.925" y="411">this </tspan><tspan x="186.674" y="411">project. </tspan><tspan x="224.001" y="411">It </tspan><tspan x="233.33" y="411">wasn&#39;t </tspan><tspan x="266.194" y="411">until </tspan><tspan x="288.345" y="411">a </tspan><tspan x="297.323" y="411">trip </tspan><tspan x="316.251" y="411">back </tspan><tspan x="341.879" y="411">to </tspan><tspan x="26" y="422">his </tspan><tspan x="46.1787" y="422">hometown </tspan><tspan x="102.041" y="422">of </tspan><tspan x="118.558" y="422">Palu </tspan><tspan x="144.488" y="422">in </tspan><tspan x="159.716" y="422">March </tspan><tspan x="195.812" y="422">2026, </tspan><tspan x="231.46" y="422">and </tspan><tspan x="256.131" y="422">a </tspan><tspan x="269.093" y="422">pivotal </tspan><tspan x="306.557" y="422">late-night </tspan><tspan x="26" y="433">conversation </tspan><tspan x="91.6677" y="433">with </tspan><tspan x="118.527" y="433">his </tspan><tspan x="138.882" y="433">family </tspan><tspan x="174.12" y="433">that </tspan><tspan x="199.895" y="433">everything </tspan><tspan x="256.149" y="433">shifted. </tspan><tspan x="297.022" y="433">After </tspan><tspan x="327.309" y="433">three </tspan><tspan x="26" y="444">months </tspan><tspan x="66.3451" y="444">of </tspan><tspan x="81.3385" y="444">grinding, </tspan><tspan x="127.299" y="444">Arumi </tspan><tspan x="160.232" y="444">Coffee </tspan><tspan x="196.407" y="444">launched </tspan><tspan x="243.793" y="444">with </tspan><tspan x="268.952" y="444">a </tspan><tspan x="280.391" y="444">raw, </tspan><tspan x="304.955" y="444">minimalist </tspan><tspan x="26" y="455">open-bar </tspan><tspan x="72.377" y="455">concept.</tspan></text>
<g id="IT WAS NEVER THE PLAN." filter="url(#filter0_d_2082_83)">
<text fill="white" style="white-space: pre" xml:space="preserve" font-family="Open Sans Condensed" font-size="50" font-weight="800" letter-spacing="0em"><tspan x="26" y="79.397">IT WAS </tspan><tspan x="26" y="129.397">NEVER THE </tspan><tspan x="26" y="179.397">PLAN.</tspan></text>
</g>
