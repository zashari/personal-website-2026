<text id="By month three, Zaky and his siblings knew they had to level up. They revamped the bar layout&#226;&#128;&#148;a move that instantly paid off and drew in a massive new crowd." fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="589" y="90">By </tspan><tspan x="606.891" y="90">month </tspan><tspan x="642.691" y="90">three, </tspan><tspan x="674.752" y="90">Zaky </tspan><tspan x="702.73" y="90">and </tspan><tspan x="726.236" y="90">his </tspan><tspan x="589" y="101">siblings </tspan><tspan x="628.119" y="101">knew </tspan><tspan x="657.316" y="101">they </tspan><tspan x="682.617" y="101">had </tspan><tspan x="704.773" y="101">to </tspan><tspan x="718.844" y="101">level </tspan><tspan x="589" y="112">up. </tspan><tspan x="611.974" y="112">They </tspan><tspan x="644.098" y="112">revamped </tspan><tspan x="699.356" y="112">the </tspan><tspan x="723.629" y="112">bar </tspan><tspan x="589" y="123">layout&#x2014;a </tspan><tspan x="639.303" y="123">move </tspan><tspan x="673.355" y="123">that </tspan><tspan x="700.494" y="123">instantly </tspan><tspan x="589" y="134">paid </tspan><tspan x="613.206" y="134">off </tspan><tspan x="630.253" y="134">and </tspan><tspan x="652.115" y="134">drew </tspan><tspan x="679.299" y="134">in </tspan><tspan x="691.718" y="134">a </tspan><tspan x="701.871" y="134">massive </tspan><tspan x="589" y="145">new </tspan><tspan x="611.012" y="145">crowd.</tspan></text>
<text id="The vibe shifted organically. People weren&#39;t just showing up for the sunset anymore; they were staying for the city lights and making the redesigned bar their go-to aesthetic photo drop." fill="#D2D2D2" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" letter-spacing="0em"><tspan x="589" y="398">The </tspan><tspan x="616.637" y="398">vibe </tspan><tspan x="646.363" y="398">shifted </tspan><tspan x="687.916" y="398">organically. </tspan><tspan x="589" y="409">People </tspan><tspan x="624.796" y="409">weren&#39;t </tspan><tspan x="663.385" y="409">just </tspan><tspan x="684.366" y="409">showing </tspan><tspan x="727.604" y="409">up </tspan><tspan x="589" y="420">for </tspan><tspan x="609.19" y="420">the </tspan><tspan x="631.51" y="420">sunset </tspan><tspan x="668.8" y="420">anymore; </tspan><tspan x="718.648" y="420">they </tspan><tspan x="589" y="431">were </tspan><tspan x="616.311" y="431">staying </tspan><tspan x="654.617" y="431">for </tspan><tspan x="672.514" y="431">the </tspan><tspan x="692.539" y="431">city </tspan><tspan x="714.605" y="431">lights </tspan><tspan x="589" y="442">and </tspan><tspan x="610.755" y="442">making </tspan><tspan x="649.112" y="442">the </tspan><tspan x="668.426" y="442">redesigned </tspan><tspan x="723.629" y="442">bar </tspan><tspan x="589" y="453">their </tspan><tspan x="621.526" y="453">go-to </tspan><tspan x="659.296" y="453">aesthetic </tspan><tspan x="712.477" y="453">photo </tspan><tspan x="589" y="464">drop.</tspan></text>
</g>
