<svg viewBox="0 0 768 536" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g>
<g>
<rect width="384" height="536" fill="#C5FB04"/>
<g filter="url(#alzheimer4-filter0_g_2129_112)">
<rect x="47" y="11" width="290" height="513" fill="url(#alzheimer4-pattern0_2129_112)"/>
</g>
<g filter="url(#alzheimer4-filter1_dn_2129_112)">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Open Sans" font-size="60" font-weight="800" letter-spacing="0em"><tspan x="26" y="419.276">SIMPLICITY&#10;</tspan><tspan x="26" y="489.276">WINS.</tspan></text>
</g>
</g>
<g clip-path="url(#alzheimer4-clip0_2129_112)">
<rect width="384" height="536" transform="translate(384)" fill="#C5FB04"/>
<g>
<g filter="url(#alzheimer4-filter2_d_2129_112)">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="408" y="206">The ultimate winner was the </tspan><tspan x="408" y="217">3D-Only V1 pipeline powered </tspan><tspan x="408" y="228">by the ResNet architecture. It </tspan><tspan x="408" y="239">absolutely dominated the </tspan><tspan x="408" y="250">volumetric representation </tspan><tspan x="408" y="261">space. Backed by rigorous </tspan><tspan x="408" y="272">statistical validation using </tspan><tspan x="408" y="283">Bootstrap, Friedman, and </tspan><tspan x="408" y="294">Nemenyi tests, ResNet proved it </tspan><tspan x="408" y="305">wasn&#39;t just a fluke&#x2014;it emerged </tspan><tspan x="408" y="316">as the clinical &#34;Gold Standard&#34; </tspan><tspan x="408" y="327">for Alzheimer&#39;s classification in </tspan><tspan x="408" y="338">this study.</tspan></text>
</g>
<g filter="url(#alzheimer4-filter3_d_2129_112)">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="576" y="71">But in healthcare, trust is everything. </tspan><tspan x="576" y="82">To prove the winning model wasn&#39;t </tspan><tspan x="576" y="93">just a black box making random </tspan><tspan x="576" y="104">guesses, Zashari integrated Grad-</tspan><tspan x="576" y="115">CAM heatmaps for explainability. </tspan><tspan x="576" y="126">The visual overlays confirmed that </tspan><tspan x="576" y="137">the AI was looking exactly where </tspan><tspan x="576" y="148">human neurologists look: straight at </tspan><tspan x="576" y="159">the structural boundaries of the </tspan><tspan x="576" y="170">hippocampus to detect disease.</tspan></text>
</g>
<g filter="url(#alzheimer4-filter4_d_2129_112)">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="408" y="71">The results completely flipped </tspan><tspan x="408" y="82">expectations. The highly </tspan><tspan x="408" y="93">complex, over-engineered V2 </tspan><tspan x="408" y="104">pipelines actually degraded </tspan><tspan x="408" y="115">model performance. The data </tspan><tspan x="408" y="126">proved that overly aggressive </tspan><tspan x="408" y="137">image enhancement and </tspan><tspan x="408" y="148">filtering actually destroyed the </tspan><tspan x="408" y="159">subtle, natural semantic </tspan><tspan x="408" y="170">information the AI needed to </tspan><tspan x="408" y="181">make an accurate diagnosis.</tspan></text>
</g>
<g filter="url(#alzheimer4-filter5_d_2129_112)">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Host Grotesk" font-size="10" font-weight="500" letter-spacing="0em"><tspan x="408" y="363">The heavily hyped Vision </tspan><tspan x="408" y="374">Transformer (ViT) also crashed hard. </tspan><tspan x="408" y="385">The architecture severely </tspan><tspan x="408" y="396">underperformed compared to </tspan><tspan x="408" y="407">traditional Convolutional Neural </tspan><tspan x="408" y="418">Networks (CNNs) because its self-</tspan><tspan x="408" y="429">attention mechanisms require </tspan><tspan x="408" y="440">massive, internet-scale datasets to </tspan><tspan x="408" y="451">learn effectively&#x2014;something that </tspan><tspan x="408" y="462">just doesn&#39;t exist yet in niche </tspan><tspan x="408" y="473">medical imaging.</tspan></text>
</g>
</g>
<g filter="url(#alzheimer4-filter6_g_2129_112)">
<rect x="591" y="179" width="140" height="357" fill="url(#alzheimer4-pattern1_2129_112)"/>
</g>
<g>
<text id="alzheimer4-01" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="421" y="41.2734">01</tspan></text>
<text id="alzheimer4-02" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="471" y="41.2734">02</tspan></text>
<text id="alzheimer4-03" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="521" y="41.2734">03</tspan></text>
<text id="alzheimer4-04" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="571" y="41.2734">04</tspan></text>
<text id="alzheimer4-05" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="621" y="41.2734">05</tspan></text>
<text id="alzheimer4-06" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="671" y="41.2734">06</tspan></text>
<text id="alzheimer4-07" fill="#474747" style="white-space: pre" xml:space="preserve" font-family="CaskaydiaCove NF" font-size="8" letter-spacing="0em"><tspan x="721" y="41.2734">07</tspan></text>
</g>
</g>
</g>
